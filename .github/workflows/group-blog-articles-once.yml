name: Group blog articles once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/group-blog-articles-once.yml'

permissions:
  contents: write

jobs:
  group-articles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Group homepage blog articles into three themes
        run: python3 scripts/group_blog_articles.py
      - name: Commit grouped blog layout
        run: |
          rm -f '.github/workflows/group-blog-articles-once.yml'
          rm -f 'scripts/group_blog_articles.py'
          git config user.name 'Dehu Zou'
          git config user.email '166377112+zoudehupowersystem@users.noreply.github.com'
          git add -A
          git commit -m 'Group blog articles into three themes'
          git push
