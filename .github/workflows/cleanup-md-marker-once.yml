name: Clean converted Markdown markers once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-md-marker-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete banner marker text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          skip = {'README.md','曼尼托巴水电局的创业史.md','manitoba-hydro-pscad-rtds-history.md'}
          n=0
          for p in Path('.').glob('*.md'):
              if p.name in skip:
                  continue
              s=p.read_text(encoding='utf-8')
              t=s.replace('\nBLOG-TOPIC-START BLOG-TOPIC-END\n','\n')
              if t != s:
                  p.write_text(t,encoding='utf-8')
                  n += 1
          print('cleaned', n, 'files')
          PY
          rm -f '.github/workflows/cleanup-md-marker-once.yml'
      - name: Commit cleanup
        run: |
          git config user.name 'Dehu Zou'
          git config user.email '166377112+zoudehupowersystem@users.noreply.github.com'
          git add -A
          git commit -m 'Clean converted Markdown article sources'
          git push
