name: Add English name once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-english-name-once.yml'

permissions:
  contents: write

jobs:
  update-name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add English name after Chinese name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<h1>邹德虎</h1>'
          new = '<h1>邹德虎 <span style="font-size:.62em;font-weight:500;color:rgba(255,255,255,.72);letter-spacing:.2px;">Dehu Zou</span></h1>'
          if old not in s:
              raise SystemExit('Expected name heading not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f '.github/workflows/add-english-name-once.yml'
      - name: Commit changes
        run: |
          git config user.name 'Dehu Zou'
          git config user.email '166377112+zoudehupowersystem@users.noreply.github.com'
          git add -A
          git commit -m 'Display English name on homepage'
          git push
