name: Revise older articles once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revise-older-articles-once.yml'

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revise older articles
        run: python3 _tools/run_revision.py

      - name: Remove one-time files and commit
        run: |
          rm -f _tools/revise_older_articles.py
          rm -f _tools/run_revision.py
          rm -f .github/workflows/revise-older-articles-once.yml
          git config user.name 'Dehu Zou'
          git config user.email '166377112+zoudehupowersystem@users.noreply.github.com'
          git add -A
          git commit -m 'Revise older blog articles for rigor and neutrality'
          git push
