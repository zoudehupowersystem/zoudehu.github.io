name: Refine homepage once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-homepage-once.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply homepage refinement
        run: python3 .github/scripts/refine_homepage.py

      - name: Commit refined homepage
        run: |
          rm -f .github/workflows/refine-homepage-once.yml
          rm -f .github/scripts/refine_homepage.py
          git config user.name 'Dehu Zou'
          git config user.email '166377112+zoudehupowersystem@users.noreply.github.com'
          git add -A
          git commit -m 'Refine homepage layout and reduce repeated content'
          git push
