name: Add consistent blog article headers once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-blog-topic-bars-once.yml'

permissions:
  contents: write

jobs:
  add-topic-bars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add theme column header to all articles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          marker = '<!-- BLOG-TOPIC-START -->'
          banner = '''
<!-- BLOG-TOPIC-START -->
<div class="zdh-blog-topic" style="max-width:980px;margin:18px auto 28px;padding:14px 16px;border:1px solid rgba(91,181,255,.35);border-radius:14px;background:linear-gradient(135deg,#0b1f3a,#102f52);box-shadow:0 8px 24px rgba(11,31,58,.14);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','PingFang SC','Microsoft YaHei',sans-serif;color:#fff;">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;">
    <div>
      <div style="font-size:12px;letter-spacing:.12em;color:#9be7ff;font-weight:700;">主题栏目 · FEATURED COLUMN</div>
      <div style="margin-top:4px;font-size:16px;line-height:1.45;font-weight:750;color:#fff;">邹德虎的博客 · Dehu Zou's Blog</div>
      <div style="margin-top:3px;font-size:12px;line-height:1.5;color:rgba(255,255,255,.72);">电力系统 · 工程技术 · 计算与仿真</div>
    </div>
    <a href="index.html" style="display:inline-flex;align-items:center;padding:8px 11px;border:1px solid rgba(255,255,255,.22);border-radius:10px;background:rgba(255,255,255,.08);color:#d8efff;text-decoration:none;font-size:13px;font-weight:650;white-space:nowrap;">← 返回个人主页 · Home</a>
  </div>
</div>
<!-- BLOG-TOPIC-END -->
'''

          changed = []
          skipped = []

          # All root-level HTML files except the homepage and verification files are article pages.
          for p in sorted(root.glob('*.html')):
              if p.name == 'index.html' or p.name.startswith('google'):
                  continue
              text = p.read_text(encoding='utf-8')
              if marker in text:
                  skipped.append(p.name)
                  continue
              new_text, n = re.subn(r'(<body\b[^>]*>)', r'\1\n' + banner, text, count=1, flags=re.I)
              if n:
                  p.write_text(new_text, encoding='utf-8')
                  changed.append(p.name)

          # The Manitoba bilingual articles are Markdown sources rendered by GitHub Pages.
          for name in ['曼尼托巴水电局的创业史.md', 'manitoba-hydro-pscad-rtds-history.md']:
              p = root / name
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              if marker not in text:
                  m = re.match(r'\A---\s*\n.*?\n---\s*\n', text, flags=re.S)
                  if not m:
                      raise RuntimeError(f'Front matter not found in {name}')
                  text = text[:m.end()] + '\n' + banner + text[m.end():]
              # The topic bar now owns the Home link; keep the bilingual switch below it.
              if name == '曼尼托巴水电局的创业史.md':
                  text = text.replace(
                      '<div class="article-nav"><a href="index.html">← 个人主页</a><a href="manitoba-hydro-pscad-rtds-history.html">English version</a></div>',
                      '<div class="article-nav"><a href="manitoba-hydro-pscad-rtds-history.html">English version →</a></div>'
                  )
              else:
                  text = text.replace(
                      '<div class="article-nav"><a href="index.html">← Home</a><a href="曼尼托巴水电局的创业史.html">中文版</a></div>',
                      '<div class="article-nav"><a href="曼尼托巴水电局的创业史.html">中文版 →</a></div>'
                  )
              p.write_text(text, encoding='utf-8')
              changed.append(name)

          print(f'Updated {len(changed)} article sources.')
          for x in changed:
              print('  +', x)
          PY
          rm -f '.github/workflows/add-blog-topic-bars-once.yml'

      - name: Commit changes
        run: |
          git config user.name 'Dehu Zou'
          git config user.email '166377112+zoudehupowersystem@users.noreply.github.com'
          git add -A
          git commit -m 'Add consistent theme column to blog articles'
          git push
